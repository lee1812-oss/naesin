<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>내신 대비 학습 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF8; --grid:#E4E8EF; --ink:#24305E; --ink2:#5B6585; --line:#CBD2E0;
  --lime:#C9EA6A; --yellow:#FFE45C; --sky:#A8DCF0; --pink:#FFC2D6; --violet:#D3C4F5;
  --ok:#2F8F5B; --okbg:#E5F4EA; --bad:#D2454B; --badbg:#FBE6E7; --warn:#B7791F; --warnbg:#FFF4D6;
  --card:#FFFFFF;
  --hand:'Nanum Pen Script', 'Apple SD Gothic Neo', cursive;
  --body:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1E29; --grid:#262C3B; --ink:#E7EAF3; --ink2:#A4ACC4; --line:#3A4258;
    --lime:#7E9A2E; --yellow:#9C8A1F; --sky:#2F6F88; --pink:#8E4560; --violet:#5D4C8F;
    --ok:#5CC48A; --okbg:#1F3A2C; --bad:#F07A7F; --badbg:#432428; --warn:#E3B04B; --warnbg:#3D3420;
    --card:#212636;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1E29; --grid:#262C3B; --ink:#E7EAF3; --ink2:#A4ACC4; --line:#3A4258;
  --lime:#7E9A2E; --yellow:#9C8A1F; --sky:#2F6F88; --pink:#8E4560; --violet:#5D4C8F;
  --ok:#5CC48A; --okbg:#1F3A2C; --bad:#F07A7F; --badbg:#432428; --warn:#E3B04B; --warnbg:#3D3420;
  --card:#212636;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
#app{max-width:860px;margin:0 auto;padding:20px 18px 60px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* 손글씨 + 형광펜 : 이 앱의 단 하나의 장식 */
.hand{font-family:var(--hand);font-weight:400;line-height:1.1}
.hl{background:linear-gradient(transparent 52%,var(--hl,var(--lime)) 52%,var(--hl,var(--lime)) 92%,transparent 92%);padding:0 .15em}
h1.hand{font-size:52px;margin:6px 0 4px}
h2.hand{font-size:38px;margin:4px 0 10px}
h3{font-size:18px;margin:22px 0 8px}
.sub{color:var(--ink2);font-size:15px;margin:0}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin:14px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{min-height:54px;padding:12px 22px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-height:42px;padding:6px 14px;font-size:15px;border-width:1.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:8px 4px;font-size:15px}

/* 홈 */
.subjects{display:grid;gap:14px;margin-top:18px}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:10px solid var(--hl);border-radius:6px;padding:18px 20px}
.subj .name{font-family:var(--hand);font-size:36px;line-height:1}
.subj .next{font-weight:700;margin-top:6px}
.steps{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.step{font-size:13px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink2)}
.step.done{background:var(--hl);border-color:transparent;color:var(--ink)}
.step.now{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.dday{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dday input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.dday .count{font-family:var(--hand);font-size:40px}

/* 문제 */
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.topbar .title{font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.timer.long{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--ink)}
.qno{font-family:var(--hand);font-size:34px;line-height:1}
.prompt{font-size:19px;font-weight:500;white-space:pre-line;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:58px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);line-height:1.5}
.opt .n{flex:0 0 auto;font-weight:700;width:1.4em}
.opt.sel{border:2.5px solid var(--ink);background:color-mix(in srgb,var(--sky) 30%,var(--card))}
.opt.right{border:2.5px solid var(--ok);background:var(--okbg)}
.opt.wrong{border:2.5px solid var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.explain,details .sub{white-space:pre-line}
.explain{margin-top:16px;padding:16px;border-radius:10px;border:1.5px dashed var(--ink2);background:var(--card)}
.verdict{font-weight:700;font-size:18px;margin-bottom:6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:20px;margin-right:4px;font-weight:700}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.slow{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.plain{background:var(--grid);color:var(--ink2)}
.actions{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%);margin-top:10px}

/* 결과 표 */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:500;font-size:14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:var(--hand);font-size:64px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:14px;color:var(--ink2)}
.ubar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.ubar .track{height:14px;background:var(--grid);border-radius:7px;overflow:hidden}
.ubar .fill{height:100%;background:var(--hl,var(--lime))}
.status{font-family:var(--hand);font-size:44px;line-height:1.1}
ul.advice{padding-left:20px;margin:6px 0}
ul.advice li{margin:6px 0}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:500}
.notice{padding:12px 14px;border-radius:8px;background:var(--warnbg);color:var(--ink);font-size:15px}

@media (max-width:560px){
  h1.hand{font-size:42px}
  .ubar{grid-template-columns:100px 1fr 46px}
  #app{padding:14px 14px 50px}
}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
}
body.capturing .noprint{display:none!important}
.seg{display:flex;gap:0;margin:16px 0 0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;max-width:760px}
.seg button{font-size:14px;padding:0 4px}
.seg button{flex:1;min-height:48px;border:0;background:transparent;font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper)}
.seglabel{margin:16px 0 0;font-weight:800;font-size:16px}.seglabel .sub{font-weight:500;font-size:13px;margin-left:6px}
.newseg{margin-top:8px}.newseg .segname{flex:0 0 auto;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:14px;border-right:2px solid var(--ink);white-space:nowrap}
.oldlv{margin-top:12px}.oldlv summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}.oldlv .seg{margin-top:6px}
.cheer{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .35s ease;z-index:999;max-width:92vw;text-align:center;pointer-events:none}
.cheer.show{transform:translate(-50%,0)}
.cheerbox{margin:12px 0 0;padding:12px 16px;border-radius:12px;background:var(--yellow);color:#1d2140;font-weight:800;font-size:18px}
.pdfdoc.inapp{position:static;width:auto;z-index:auto;border:1px solid var(--line);border-radius:6px;margin-top:14px;overflow-x:auto}
.pdfdoc .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.pdfdoc .kp div{border:1.5px solid #cfd5e3;border-radius:6px;padding:8px 10px}
.pdfdoc .kp b{display:block;font-size:20px;color:#24305e}
.pdfdoc .kp span{font-size:12px;color:#5b6585}
.pdfbusy{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;padding:20px;text-align:center}
.pdfdoc{position:absolute;left:0;top:0;z-index:1;width:760px;background:#fff;color:#1d2440;font-family:var(--body);font-size:14px;line-height:1.55}
.pdfdoc .sec{padding:28px 30px;background:#fff}
.pdfdoc h1{font-size:24px;margin:0 0 4px}.pdfdoc h2{font-size:20px;margin:0 0 6px}.pdfdoc h3{font-size:15px;margin:18px 0 6px;color:#24305e}
.pdfdoc .m{color:#5b6585;font-size:12.5px}
.pdfdoc table{border-collapse:collapse;width:100%;font-size:12.5px}
.pdfdoc th,.pdfdoc td{border:1px solid #cfd5e3;padding:5px 6px;text-align:left;vertical-align:top}
.pdfdoc th{background:#eef1f7;font-weight:700}
.pdfdoc td.c,.pdfdoc th.c{text-align:center}
.pdfdoc .x{color:#c23b40;font-weight:700}.pdfdoc .o{color:#2a7d51;font-weight:700}.pdfdoc .s{color:#a86b10;font-weight:700}
.pdfdoc .box{border:1.5px solid #24305e;border-radius:6px;padding:10px 12px;margin:8px 0}
.refbox{margin:8px 0 4px;padding:10px 14px;border-left:6px solid var(--pink);background:var(--card);border-radius:6px;font-size:15px}
@media print{
  body{background:#fff}
  .noprint,.topbar,.actions{display:none!important}
  .sheet{break-inside:avoid}
}
</style>
</head>

(function(){
var PWK="nsh-unlock";
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var k=0;k<x.length;k++)u[k]=x.charCodeAt(k);return u;}
function tryPw(pw){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error("nocrypto"));
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(NS_ENC.s),iterations:NS_ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(NS_ENC.i)},k,b(NS_ENC.c));}).then(function(buf){return new TextDecoder().decode(buf);});
}
function run(code,pw){
  try{localStorage.setItem(PWK,pw);}catch(e){}
  NS_ENC.c="";
  var s=document.createElement("script");s.text=code;document.body.appendChild(s);
}
function lockUI(msg){
  var a=document.getElementById("app");
  a.innerHTML='<h1 class="hand"><span class="hl">내신 대비 학습 도우미</span></h1><div class="sheet" style="max-width:420px"><p style="margin-top:0"><b>🔒 비밀번호를 입력해 주세요</b></p><p class="sub">이 아이패드에서 한 번만 입력하면 다음부터는 묻지 않아요.</p><form id="pwf" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="pw" type="password" inputmode="numeric" autocomplete="off" style="flex:1;font-size:22px;padding:10px 12px;border:1.5px solid var(--line,#ccc);border-radius:10px;letter-spacing:6px;min-width:0" aria-label="비밀번호"><button class="btn" type="submit" style="white-space:nowrap;flex:none">열기</button></form><p id="pwmsg" class="sub" style="margin-bottom:0;color:#c0392b">'+(msg||"")+'</p></div>';
  var f=document.getElementById("pwf"),inp=document.getElementById("pw");
  setTimeout(function(){inp.focus();},50);
  f.onsubmit=function(ev){ev.preventDefault();var pw=inp.value.trim();if(!pw)return;
    document.getElementById("pwmsg").textContent="확인하는 중…";
    tryPw(pw).then(function(code){run(code,pw);},function(e){
      if(e&&e.message==="nocrypto"){document.getElementById("pwmsg").textContent="이 화면에서는 열 수 없어요. Safari로 주소를 열어 주세요.";return;}
      document.getElementById("pwmsg").textContent="비밀번호가 맞지 않아요. 다시 입력해 주세요.";inp.value="";inp.focus();});
  };
}
var saved=null;try{saved=localStorage.getItem(PWK);}catch(e){}
if(saved){tryPw(saved).then(function(code){run(code,saved);},function(){try{localStorage.removeItem(PWK);}catch(e){}lockUI("");});}
else lockUI("");
})();
