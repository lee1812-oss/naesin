<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive">
<title>내신 대비 학습 도우미</title>
<style>:root{--bg:#F7F6F1;--card:#fff;--ink:#1F2340;--sub:#5B6075;--line:#DADCE6}
@media (prefers-color-scheme:dark){:root{--bg:#15171F;--card:#1E2130;--ink:#ECEEF6;--sub:#A3A8BC;--line:#33384C}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:48px 16px}h1{font-size:28px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}.sub{color:var(--sub)}</style></head>
<body><main><h1>내신 대비 학습 도우미 ✏️</h1>
<div class="card"><b>2차 중간고사 문제를 새로 준비하고 있어요.</b><p class="sub" style="margin-bottom:0">1차 시험 범위 문제는 정리했어요. 새 시험 범위로 만든 문제가 이 주소에 곧 올라와요. 조금만 기다려 주세요! 💪</p></div>
</main></body></html>
