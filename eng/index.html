<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>영어 본문 정리</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFBF8;--grid:#E4E8EF;--ink:#24305E;--ink2:#5B6585;--line:#CBD2E0;--yellow:#FFE45C;--ok:#2F8F5B;--okbg:#E5F4EA;--bad:#D2454B;--badbg:#FBE6E7;--card:#fff;--hand:'Nanum Pen Script',cursive;--body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1A1E29;--grid:#262C3B;--ink:#E7EAF3;--ink2:#A4ACC4;--line:#3A4258;--yellow:#9C8A1F;--ok:#5CC48A;--okbg:#1F3A2C;--bad:#F07A7F;--badbg:#432428;--card:#212636}}
:root[data-theme="dark"]{--paper:#1A1E29;--grid:#262C3B;--ink:#E7EAF3;--ink2:#A4ACC4;--line:#3A4258;--yellow:#9C8A1F;--ok:#5CC48A;--okbg:#1F3A2C;--bad:#F07A7F;--badbg:#432428;--card:#212636}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
#app{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-family:var(--hand);font-weight:400;font-size:44px;margin:4px 0 2px;line-height:1.1}
h1 .hl{background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 12px}
.back{display:inline-block;color:var(--ink2);font-size:14px;text-decoration:none;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:12px}
.tab{border:0;background:var(--card);color:var(--ink);padding:12px;font:700 17px var(--body)}
.tab.on{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 15px var(--body)}
.btn.red{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--line);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px;margin-left:8px}
.btn.big{width:100%;padding:14px;font-size:17px;background:var(--ink);color:var(--paper);margin-top:12px}
.btn:disabled{opacity:.4}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.center{text-align:center}
.card .big{font-size:44px;font-weight:700}
.ct{font-weight:700;font-size:17px}
.cs{color:var(--ink2);font-size:14px;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;display:flex;overflow:hidden;margin-top:8px}
.bar i{background:var(--ok);display:block}.bar i.x{background:var(--bad)}
.note{color:var(--ink2);font-size:14px;line-height:1.7}
.rs{display:none;background:var(--badbg);border-radius:12px;padding:12px;font-size:15px}.rs.on{display:block}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top .pg{font-weight:700}.top .sc{margin-left:auto}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--ink)}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.qs{color:var(--ink2);font-size:13px;margin-bottom:8px}
.qp{white-space:pre-line;font-size:17px;line-height:1.75;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:16px/1.6 var(--body);-webkit-tap-highlight-color:transparent}
.opt .n{font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrongp{border-color:var(--bad);background:var(--badbg)}
.res{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:18px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.ex{white-space:pre-line;margin-top:10px;padding:14px;border-left:4px solid var(--ink);background:var(--paper);font-size:15.5px;line-height:1.8;border-radius:0 10px 10px 0}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.sm2{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:600 14px var(--body)}
.tabs3{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:10px}
.tabs3 .tab{border:0;background:var(--card);color:var(--ink);padding:12px 4px;font:700 16px var(--body)}.tabs3 .tab.on{background:var(--ink);color:var(--paper)}
.chips,.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.lb{font-size:13px;color:var(--ink2);font-weight:700;margin-right:2px}
.chip,.tg{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px var(--body)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}.tg.on{border-color:var(--ink);background:var(--yellow);color:#24305E}
.gh{font-family:var(--hand);font-size:30px;margin:16px 0 6px;border-bottom:2px solid var(--ink)}
.wc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.wc.kn{border-color:var(--ok)}
.wt{display:flex;align-items:center;gap:8px;margin-bottom:6px}.no{background:var(--ink);color:var(--paper);border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px}
.ww{font-size:21px;font-weight:700}.wb{font-size:12px;color:var(--bad);font-weight:700}.kb{font-size:12px;color:var(--ok);font-weight:700}
.star{margin-left:auto;border:0;background:none;font-size:22px;padding:0 4px;color:var(--ink)}
.cl{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:15.5px;line-height:1.6}
.cn{flex:none;width:52px;font-size:12.5px;font-weight:700;border-radius:6px;text-align:center;padding:2px 0;margin-top:2px}
.cm{background:#FFF3B0;color:#5A4A00}.cs2,.cs{}.cn.cs{background:#DCEBFF;color:#1D4E89}.cn.ca,.cn.ca{background:#FFE1E1;color:#8A1F25}
.cn.cs2{background:#DCEBFF;color:#1D4E89}
.ko{color:var(--ink2);font-size:.9em}
.cv{position:relative;flex:1;min-width:0}.cv .cover{display:none}
.cv.hid .in{visibility:hidden}.cv.hid .cover{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,var(--grid),var(--grid) 6px,var(--paper) 6px,var(--paper) 12px);border:1.5px dashed var(--line);border-radius:8px;color:var(--ink2);font-size:13px;min-height:28px}
.cv.hid.open .in{visibility:visible}.cv.hid.open .cover{display:none}
.fc{background:var(--card);border:2px solid var(--ink);border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 4px 0 var(--ink);-webkit-tap-highlight-color:transparent}
.fw{font-size:40px;font-weight:700}.fw.sm{font-size:30px}.fk{font-size:30px;font-weight:700}.fk.sm{font-size:21px;color:var(--ink2);margin:4px 0 12px}
.tap{margin-top:18px;color:var(--ink2);font-size:13px}.bk{width:100%;text-align:left}.bk .fw,.bk .fk{text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.two .btn{padding:14px;font-size:17px}.btn.okb{border-color:var(--ok);color:var(--ok)}
.cs2t{color:#1D4E89}.cat{color:#8A1F25}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cn.cs2{background:#1F3550;color:#BBD7FF}:root:not([data-theme="light"]) .cn.ca{background:#4A2326;color:#FFC4C7}:root:not([data-theme="light"]) .cm{background:#4A4214;color:#FFEFA0}:root:not([data-theme="light"]) .cs2t{color:#9CC4FF}:root:not([data-theme="light"]) .cat{color:#FF9EA3}}
.tabs3 small{font-weight:500;opacity:.8}
.nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);padding:8px 0;margin-bottom:6px;border-bottom:1.5px solid var(--line)}
.nv{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font:700 14px var(--body);color:var(--ink);text-decoration:none;background:var(--card)}.nv.r{border-color:var(--ok);color:var(--ok)}
.nr{margin-left:auto;font-size:13px;color:var(--ink2)}
.ps{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.ps.done{border-color:var(--ok)}
.ph{display:flex;gap:12px;align-items:flex-start}.pn{flex:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:6px 10px;font-weight:700;font-size:16px}
.ttl{font-size:19px;font-weight:700;line-height:1.4}.hd{font-size:13px;color:var(--ink2);font-style:italic;margin-top:2px}
.topic{margin:12px 0 4px;background:var(--yellow);color:#24305E;border-radius:10px;padding:8px 12px;font-size:15.5px;line-height:1.6}
.sec{margin-top:14px}.sh{font-weight:700;font-size:15px;margin-bottom:6px;border-bottom:2px solid var(--ink);display:inline-block;padding-bottom:2px}
.sum{margin:4px 0;padding-left:20px;line-height:1.75;font-size:15.5px}
.flow{list-style:none;counter-reset:f;margin:6px 0;padding:0}
.flow li{counter-increment:f;display:flex;gap:10px;align-items:flex-start;padding:7px 0 7px 4px;border-left:3px solid var(--line);margin-left:12px;position:relative;line-height:1.6;font-size:15.5px}
.flow li:before{content:counter(f);position:absolute;left:-13px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.st{flex:none;margin-left:16px;font-size:12px;font-weight:700;background:#DCEBFF;color:#1D4E89;border-radius:6px;padding:2px 7px;margin-top:2px}
.cue{display:inline-block;font-size:13px;font-weight:700;background:#FFE1E1;color:#8A1F25;border-radius:6px;padding:0 6px;margin-left:4px;font-style:italic}
.tip{background:var(--paper);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 12px;font-size:15px;line-height:1.7;margin-top:6px}
.pts{width:100%;border-collapse:collapse;font-size:15px;line-height:1.65}.pts th{width:76px;text-align:left;vertical-align:top;padding:7px 8px 7px 0;color:var(--ink2);font-size:13px}.pts td{padding:7px 0;border-bottom:1px dashed var(--line)}
.rb{margin-top:12px;width:100%;border:2px dashed var(--line);background:none;color:var(--ink2);border-radius:12px;padding:10px;font:700 15px var(--body)}.rb.on{border:2px solid var(--ok);color:var(--ok);background:var(--okbg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st{background:#1F3550;color:#BBD7FF}:root:not([data-theme="light"]) .cue{background:#4A2326;color:#FFC4C7}}
</style></head>

(function(){
var PWK="nsh-unlock";
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var k=0;k<x.length;k++)u[k]=x.charCodeAt(k);return u;}
function tryPw(pw){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error("nocrypto"));
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(NS_ENC.s),iterations:NS_ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(NS_ENC.i)},k,b(NS_ENC.c));}).then(function(buf){return new TextDecoder().decode(buf);});
}
function run(code,pw){try{localStorage.setItem(PWK,pw);}catch(e){}document.getElementById("lock").innerHTML="";document.getElementById("body").style.display="";var s=document.createElement("script");s.text=code;document.body.appendChild(s);}
function lockUI(msg){
  var a=document.getElementById("lock");
  a.innerHTML='<div class="sheet" style="max-width:420px"><p style="margin-top:0"><b>🔒 비밀번호를 입력해 주세요</b></p><form id="pwf" style="display:flex;gap:8px"><input id="pw" type="password" inputmode="numeric" autocomplete="off" style="flex:1;font-size:22px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;letter-spacing:6px;min-width:0"><button class="sm2" type="submit">열기</button></form><p id="pwmsg" class="sub" style="color:#c0392b;margin:8px 0 0">'+(msg||"")+'</p></div>';
  var f=document.getElementById("pwf"),inp=document.getElementById("pw");
  f.onsubmit=function(ev){ev.preventDefault();var pw=inp.value.trim();if(!pw)return;
    tryPw(pw).then(function(c){run(c,pw);},function(){document.getElementById("pwmsg").textContent="비밀번호가 맞지 않아요.";inp.value="";});};
}
var saved=null;try{saved=localStorage.getItem(PWK);}catch(e){}
if(saved){tryPw(saved).then(function(c){run(c,saved);},function(){lockUI("");});}else lockUI("");
})();
