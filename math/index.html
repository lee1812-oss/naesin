<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>미적분Ⅰ 시험 직전 총정리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#F7F6F1;--card:#FFFFFF;--ink:#1F2340;--sub:#5B6075;--line:#DADCE6;--acc:#3D5AFE;--accbg:#E8ECFF;--ok:#1E8E5A;--okbg:#E3F5EC;--bad:#C2413A;--badbg:#FBE8E6;--yel:#FFE45C;--b1:#B9E4C9;--b2:#FFE7A3;--b3:#FFC9C2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171F;--card:#1E2130;--ink:#ECEEF6;--sub:#A3A8BC;--line:#33384C;--acc:#8EA2FF;--accbg:#262D4D;--ok:#5FD49A;--okbg:#17332A;--bad:#FF8C83;--badbg:#3A1F1E;--yel:#8A7A1C;--b1:#245A3B;--b2:#6B5A1C;--b3:#6E2E28}}
:root[data-theme="dark"]{--bg:#15171F;--card:#1E2130;--ink:#ECEEF6;--sub:#A3A8BC;--line:#33384C;--acc:#8EA2FF;--accbg:#262D4D;--ok:#5FD49A;--okbg:#17332A;--bad:#FF8C83;--badbg:#3A1F1E;--yel:#8A7A1C;--b1:#245A3B;--b2:#6B5A1C;--b3:#6E2E28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:22px;margin:18px 0 8px}
.sub{color:var(--sub);font-size:15px}
.sheet,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.unit{display:block;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);font:inherit}
.unit b{font-size:19px}.unit .bar{height:8px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}.unit .bar i{display:block;height:100%;background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.tabs{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin:12px 0}
.tabs button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.link{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.cc h3{margin:0 0 8px;font-size:19px}.cc ul{margin:6px 0;padding-left:22px}
.lv{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;color:#1d2140}
.lv.기본{background:var(--b1)}.lv.3점{background:var(--b2)}.lv.4점{background:var(--b3)}
:root[data-theme="dark"] .lv,.dk .lv{color:#fff}
.qnum{font-size:15px;color:var(--sub)}
.prob{font-size:19px;margin:10px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt .n{font-weight:800;color:var(--sub);min-width:22px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input.num{font:inherit;font-size:22px;width:160px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.res{border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:700}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.hint{background:var(--accbg);border-radius:12px;padding:12px 14px;margin-top:12px}
.step{border-left:4px solid var(--acc);padding:6px 0 6px 14px;margin:10px 0}
.step .k{font-size:13px;font-weight:800;color:var(--acc)}
.tip{background:var(--yel);color:#1d2140;border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:700}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--acc)}
.cheer{position:fixed;left:50%;top:14px;transform:translate(-50%,-180%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .35s ease;z-index:99;max-width:92vw;text-align:center;pointer-events:none}
.cheer.show{transform:translate(-50%,0)}
.gq{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.katex{font-size:1.08em}.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
@media (max-width:520px){body{font-size:17px}.prob{font-size:18px}h1{font-size:24px}}
</style>
</head>

(function(){
var PWK="nsh-unlock";
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var k=0;k<x.length;k++)u[k]=x.charCodeAt(k);return u;}
function tryPw(pw){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error("nocrypto"));
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(NS_ENC.s),iterations:NS_ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(NS_ENC.i)},k,b(NS_ENC.c));}).then(function(buf){return new TextDecoder().decode(buf);});
}
function run(code,pw){
  try{localStorage.setItem(PWK,pw);}catch(e){}
  NS_ENC.c="";
  var s=document.createElement("script");s.text=code;document.body.appendChild(s);
}
function lockUI(msg){
  var a=document.getElementById("app");
  a.innerHTML='<h1 class="hand"><span class="hl">미적분Ⅰ 시험 직전 총정리</span></h1><div class="sheet" style="max-width:420px"><p style="margin-top:0"><b>🔒 비밀번호를 입력해 주세요</b></p><p class="sub">이 아이패드에서 한 번만 입력하면 다음부터는 묻지 않아요.</p><form id="pwf" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="pw" type="password" inputmode="numeric" autocomplete="off" style="flex:1;font-size:22px;padding:10px 12px;border:1.5px solid var(--line,#ccc);border-radius:10px;letter-spacing:6px;min-width:0" aria-label="비밀번호"><button class="btn" type="submit" style="white-space:nowrap;flex:none">열기</button></form><p id="pwmsg" class="sub" style="margin-bottom:0;color:#c0392b">'+(msg||"")+'</p></div>';
  var f=document.getElementById("pwf"),inp=document.getElementById("pw");
  setTimeout(function(){inp.focus();},50);
  f.onsubmit=function(ev){ev.preventDefault();var pw=inp.value.trim();if(!pw)return;
    document.getElementById("pwmsg").textContent="확인하는 중…";
    tryPw(pw).then(function(code){run(code,pw);},function(e){
      if(e&&e.message==="nocrypto"){document.getElementById("pwmsg").textContent="이 화면에서는 열 수 없어요. Safari로 주소를 열어 주세요.";return;}
      document.getElementById("pwmsg").textContent="비밀번호가 맞지 않아요. 다시 입력해 주세요.";inp.value="";inp.focus();});
  };
}
var saved=null;try{saved=localStorage.getItem(PWK);}catch(e){}
if(saved){tryPw(saved).then(function(code){run(code,saved);},function(){try{localStorage.removeItem(PWK);}catch(e){}lockUI("");});}
else lockUI("");
})();
